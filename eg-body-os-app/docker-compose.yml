services:
  db:
    image: postgres:16-alpine
    container_name: eg-body-os-db
    environment:
      POSTGRES_USER: eg
      POSTGRES_PASSWORD: eg
      POSTGRES_DB: eg_body_os
    ports:
      - "5432:5432"
    volumes:
      - eg_body_os_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eg -d eg_body_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eg_body_os_pg:
